name: Build MGE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: تثبيت التبعيات
        run: npm install
      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: إعداد أندرويد وصلاحيات NFC
        run: |
          npx cap add android || true
          npx cap sync android
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.NFC' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.NFC" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />' "$manifest"
          fi
      - name: بناء APK عبر Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
