<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGE Security | فحص أصالة المنتجات</title>
<style>
:root{--ink:#132238;--muted:#64748b;--line:#d9e2ec;--mint:#08a77b;--mint-bg:#e7f8f2;--bad:#dc3d4b;--paper:#f5f8fa}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:var(--paper);color:var(--ink);padding:20px;min-height:100vh}.shell{max-width:460px;margin:auto}.brand{text-align:center;margin:24px 0}.brand h1{font-size:1.4rem;margin:0}.brand p{color:var(--muted);font-size:.88rem;margin:6px 0}.card,.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;box-shadow:0 8px 24px #1322380a}.signal{width:86px;height:86px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--mint-bg);font-size:2.4rem;animation:pulse 2s infinite;cursor:pointer}@keyframes pulse{70%{box-shadow:0 0 0 16px #08a77b00}0%{box-shadow:0 0 0 0 #08a77b66}}button{border:0;border-radius:10px;cursor:pointer;font-weight:700;font-size:1rem;padding:13px;width:100%}.primary{background:var(--mint);color:white}.dark{background:var(--ink);color:#fff;margin-top:14px}.manual{display:flex;gap:8px;margin-top:16px}.manual input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center;font-size:.95rem}.manual button{width:auto;background:var(--ink);color:#fff}.result{display:none;padding:0;overflow:hidden;text-align:right}.result-head{color:#fff;padding:15px;font-weight:700;text-align:center}.original{background:var(--mint)}.fake{background:var(--bad)}.result-body{padding:18px}.result img{width:100%;height:190px;object-fit:cover;border-radius:10px}.result h2{font-size:1.1rem;margin-bottom:6px}.result p{color:var(--muted);font-size:.9rem}.data{width:100%;border-collapse:collapse;background:#f7fafc;font-size:.85rem}.data td{padding:10px;border-bottom:1px solid var(--line)}.data td:last-child{text-align:left;font-weight:700;direction:ltr}
</style></head><body><main class="shell"><header class="brand"><h1>منظومة MGE للتوثيق الذكي</h1><p>التحقق العتادي الفوري من أصالة المنتج</p></header><section class="card" id="scanCard"><div class="signal" onclick="readNfc()">◉</div><h2>جاهز للفحص</h2><p style="color:var(--muted);font-size:.88rem">المس ظهر الهاتف بشريحة NFC على العبوة</p><button class="primary" onclick="readNfc()">تشغيل حساس NFC</button><div style="margin:16px 0 8px;color:var(--muted);font-size:.8rem">أو فحص الكود يدويًا</div><div class="manual"><input id="manualCode" placeholder="مثال: 04A28F1B3E6C80"><button onclick="verifyCode()">فحص</button></div></section><section class="result" id="result"><div class="result-head" id="resultHead"></div><div class="result-body"><img id="resultImage" alt="صورة المنتج"><h2 id="resultTitle"></h2><p id="resultDescription"></p><table class="data"><tr><td>كود القطعة</td><td id="resultCode">-</td></tr><tr><td>رقم التشغيلة</td><td id="resultBatch">-</td></tr><tr><td>تاريخ الإنتاج</td><td id="resultDate">-</td></tr><tr><td>سجل القراءات</td><td id="resultScans">-</td></tr></table><button class="dark" onclick="resetView()">فحص قطعة أخرى</button></div></section></main><script>
const fallbackImage='https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=500';
async function readNfc(){if(!('NDEFReader'in window))return alert('ميزة Web NFC تتطلب متصفح Chrome على أندرويد.');try{const reader=new NDEFReader();await reader.scan();alert('قرّب ظهر الهاتف من الاستيكر الآن...');reader.onreading=e=>{for(const record of e.message.records){const code=new TextDecoder().decode(record.data).split(/[/?=]+/).pop().trim();if(code)return showResult(code)}}}catch(error){alert('تعذر تشغيل الحساس: '+error.message)}}
function verifyCode(){const code=document.getElementById('manualCode').value.trim();if(code)showResult(code)}
async function showResult(code){document.getElementById('scanCard').style.display='none';const panel=document.getElementById('result');panel.style.display='block';try{const response=await fetch('/verify?c='+encodeURIComponent(code));const payload=await response.json();if(!response.ok)throw new Error(payload.message);renderOriginal(payload.data)}catch(error){renderFake(code,error.message)}}
function renderOriginal(item){document.getElementById('resultHead').className='result-head original';document.getElementById('resultHead').textContent='✓ منتج أصلي وموثق رسميًا (MGE Verified)';document.getElementById('resultImage').src=item.imageUrl;document.getElementById('resultTitle').textContent=item.name;document.getElementById('resultDescription').textContent=item.description;fill(item.uid,item.batch,item.productionDate,item.scanCount+' مرات')}
function renderFake(code,message){document.getElementById('resultHead').className='result-head fake';document.getElementById('resultHead').textContent='✕ تحذير: منتج غير مسجل أو مقلد!';document.getElementById('resultImage').src=fallbackImage;document.getElementById('resultTitle').textContent='بيانات غير متطابقة';document.getElementById('resultDescription').textContent=message||'لم يتم العثور على هذا الكود داخل قاعدة البيانات.';fill(code,'غير معروف','-','0')}
function fill(code,batch,date,scans){for(const [id,value] of Object.entries({resultCode:code,resultBatch:batch,resultDate:date,resultScans:scans}))document.getElementById(id).textContent=value}
function resetView(){document.getElementById('result').style.display='none';document.getElementById('scanCard').style.display='block';document.getElementById('manualCode').value=''}
</script></body></html>
<script>
    // إعادة التوجيه الفوري لمحطة البرمجة الصناعية
    window.location.replace("writer.html");
</script>
