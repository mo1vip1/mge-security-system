<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGE | طباعة الملصقات</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f1f5f9;padding:20px;margin:0}.panel,.sticker{background:#fff;border:1px solid #cbd5e1;border-radius:10px}.panel{max-width:800px;margin:auto;padding:20px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.fields input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:11px;border:0;border-radius:8px;color:white;font-weight:700;cursor:pointer}.generate{background:#2364d2}.print{background:#132238}.stickers{max-width:800px;margin:20px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sticker{text-align:center;padding:9px;page-break-inside:avoid}.title{font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden}.code{font: .65rem monospace;background:#e2e8f0;padding:3px;margin:4px}.qr{display:flex;justify-content:center;margin:6px}@media(max-width:600px){.fields{grid-template-columns:1fr 1fr}.stickers{grid-template-columns:repeat(2,1fr)}}@media print{body{padding:0;background:#fff}.panel{display:none}.stickers{margin:0;max-width:none}}
</style></head><body><section class="panel"><h2>تجهيز ملصقات MGE للطباعة الورقية</h2><div class="fields"><input id="name" value="سيروم علاجي للشعر"><input id="prefix" value="MGE-"><input id="start" type="number" value="1001"><input id="quantity" type="number" value="8"></div><div class="actions"><button class="generate" onclick="makeLabels()">توليد الاستيكرات</button><button class="print" onclick="print()">طباعة</button></div></section><section class="stickers" id="stickers"></section><script>function makeLabels(){const area=document.getElementById('stickers');area.innerHTML='';const name=document.getElementById('name').value,prefix=document.getElementById('prefix').value,start=Number(document.getElementById('start').value),quantity=Math.max(0,Number(document.getElementById('quantity').value));for(let index=0;index<quantity;index++){const code=prefix+(start+index),sticker=document.createElement('div');sticker.className='sticker';sticker.innerHTML=`<div class="title">${name}</div><div class="code">${code}</div><div class="qr" id="qr-${index}"></div><small>NFC + QR Verified</small>`;area.append(sticker);new QRCode(sticker.querySelector('.qr'),{text:'https://verify.mge-security.com/?c='+code,width:65,height:65})}}window.addEventListener('load',makeLabels)</script></body></html>
