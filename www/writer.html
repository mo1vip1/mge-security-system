<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGE | محطة البرمجة</title><style>:root{--ink:#132238;--blue:#2364d2;--line:#d9e2ec}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f5f8fa;color:var(--ink);padding:18px}.wrap{max-width:560px;margin:auto}.header,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.header{display:flex;justify-content:space-between;align-items:center}.header h1{font-size:1.15rem;margin:0}.row{margin-bottom:12px}.row label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}.row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{cursor:pointer;border:0;border-radius:8px;padding:11px;font-weight:700}.write{width:100%;background:var(--blue);color:white;font-size:1rem}.write.active{background:#d65b19}.notice{display:none;margin-top:12px;padding:11px;text-align:center;border-radius:8px;font-size:.85rem}.wait{display:block;background:#fff0dd;color:#b45309}.ok{display:block;background:#e4f8eb;color:#168046}table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:10px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}th{background:#f1f5f9}</style></head><body><main class="wrap"><header class="header"><div><h1>محطة برمجة MGE الصناعية</h1><small>نظام خطوط الإنتاج والتوثيق العتادي</small></div><button onclick="exportCsv()">تصدير CSV</button></header><section class="card"><div class="row"><label>اسم الصنف</label><input id="product" value="سيروم علاجي للشعر"></div><div class="grid"><div class="row"><label>رقم التشغيلة</label><input id="batch" value="BATCH-2026-X"></div><div class="row"><label>العداد الحالي</label><input id="counter" type="number" value="1001"></div></div><button class="write" id="action" onclick="toggleWriter()">تفعيل وضع البرمجة التلقائية</button><div class="notice" id="notice"></div></section><section class="card"><strong>سجل القطع المبرمجة (<span id="count">0</span>)</strong><table><thead><tr><th>الكود</th><th>التشغيلة</th><th>الوقت</th><th>الحالة</th></tr></thead><tbody id="logs"></tbody></table></section></main><script>let active=false,controller,logs=[];async function toggleWriter(){const button=document.getElementById('action'),notice=document.getElementById('notice');if(active){controller?.abort();active=false;button.textContent='تفعيل وضع البرمجة التلقائية';button.classList.remove('active');notice.style.display='none';return}if(!('NDEFReader'in window))return alert('يتطلب هاتفًا يدعم NFC مع متصفح Chrome.');active=true;button.textContent='إيقاف وضع البرمجة';button.classList.add('active');notice.className='notice wait';notice.textContent='جاهز: قرّب الشريحة الفارغة من ظهر الهاتف...';writeNext()}async function writeNext(){if(!active)return;try{controller=new AbortController();const reader=new NDEFReader(),counter=document.getElementById('counter'),code='MGE-'+counter.value;await reader.write({records:[{recordType:'url',data:'https://verify.mge-security.com/?c='+code}]},{signal:controller.signal});logs.push({code,batch:document.getElementById('batch').value,time:new Date().toLocaleTimeString('ar-EG')});document.getElementById('logs').insertAdjacentHTML('afterbegin',`<tr><td>${code}</td><td>${logs.at(-1).batch}</td><td>${logs.at(-1).time}</td><td>ناجح ✓</td></tr>`);document.getElementById('count').textContent=logs.length;counter.value=Number(counter.value)+1;document.getElementById('notice').className='notice ok';document.getElementById('notice').textContent='تمت الكتابة بنجاح. قرّب الشريحة التالية...';setTimeout(writeNext,1200)}catch(error){if(active)setTimeout(writeNext,800)}}function exportCsv(){if(!logs.length)return alert('لا توجد بيانات مسجلة للتصدير');const csv='\uFEFFالكود,التشغيلة,الوقت\n'+logs.map(row=>`"${row.code}","${row.batch}","${row.time}"`).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='MGE_Production.csv';link.click()}</script></body></html>
